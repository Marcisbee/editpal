name: Repair JSR provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: jsr-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Attach provenance to the current JSR version
    if: github.repository == 'Marcisbee/editpal'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the current version
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Attach and verify JSR provenance
        run: npm run jsr:provenance
